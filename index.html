<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terranativa - Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-image: url("fundo.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 480px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header-title {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }

    .header-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-align: center;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .services-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .services-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1rem;
      font-weight: 500;
    }

    .services-list li span.icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="header-title">Terranativa</h1>
    <p class="header-subtitle">MUDAS FLORESTAIS & AGRICULTURA</p>

    <h2 class="section-title">Temos mudas para o varejo e atacado:</h2>

    <ul class="services-list">
      <li>
        <span class="icon">🌱</span>
        <span>Arborização Urbana</span>
      </li>
      <li>
        <span class="icon">🌱</span>
        <span>Mudas Frutíferas</span>
      </li>
      <li>
        <span class="icon">🌱</span>
        <span>Reflorestamento Ambiental</span>
      </li>
      <li>
        <span class="icon">🌱</span>
        <span>Mudas do Cerrado</span>
      </li>
      <li>
        <span class="icon">🚚</span>
        <span>Enviamos para todo Brasil</span>
      </li>
    </ul>
  </div>

</body>
</html>
