<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terranativa - Mudas Florestais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1b8a6b;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mudas Florestais acima do título */
        .sub-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a7f3d0;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .logo-title img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Bloco de Descrição da Imagem */
        .description-box {
            background: rgba(0, 0, 0, 0.15);
            border-left: 4px solid #6ee7b7;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            font-size: 15px;
            line-height: 1.8;
            text-align: left;
        }

        .description-box p {
            margin-bottom: 4px;
        }

        .description-box .title-desc {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        /* Carrossel Maior */
        .carousel-box {
            position: relative;
            width: 100%;
            max-width: 550px;
            height: 360px;
            border: 2px solid #52d6b0;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .carousel-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .arrow.left { left: 15px; }
        .arrow.right { right: 15px; }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 380px;
            align-items: center;
        }

        .btn-wrapper {
            width: 100%;
            text-align: center;
        }

        .catalog-text {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e6fffa;
            margin-bottom: 6px;
        }

        /* Animação de Pulo */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-8px);
            }
            60% {
                transform: translateY(-4px);
            }
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            text-align: center;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            animation: bounce 2s infinite;
        }

        .btn-whatsapp {
            background-color: #6ee7b7;
            color: #064e3b;
        }

        .btn-instagram {
            background-color: #fbcfe8;
            color: #831843;
            animation-delay: 0.2s;
        }
    </style>
</head>
<body>

    <div class="sub-header">Mudas Florestais</div>

    <div class="logo-title">
        <img src="logo.png" alt="Terranativa Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/45?text=🌾';">
        Terranativa
    </div>

    <!-- Descrição -->
    <div class="description-box">
        <div class="title-desc">Temos mudas para o varejo e atacado</div>
        <p>🌳 Arborização Urbana</p>
        <p>🌴 Mudas Frutíferas</p>
        <p>🌱 Reflorestamento Ambiental</p>
        <p>🌱 Mudas do Cerrado</p>
        <p>🚚 Enviamos para todo Brasil</p>
    </div>

    <!-- Carrossel Maior -->
    <div class="carousel-box">
        <button class="arrow left" onclick="prevSlide()">❮</button>
        <img id="carouselImage" src="foto1.png" alt="Carrossel Terranativa" onerror="this.onerror=null; this.src='https://via.placeholder.com/550x360?text=Mudas+Terranativa';">
        <button class="arrow right" onclick="nextSlide()">❯</button>
    </div>

    <!-- Botões -->
    <div class="btn-group">
        <div class="btn-wrapper">
            <div class="catalog-text">Confira o nosso catálogo</div>
            <a href="https://wa.me/5562991744925" class="btn btn-whatsapp" target="_blank">Fale no WhatsApp</a>
        </div>
        <div class="btn-wrapper">
            <a href="https://www.instagram.com/terranativamudas" class="btn btn-instagram" target="_blank">Siga no Instagram</a>
        </div>
    </div>

    <script>
        const images = ["foto1.png", "foto2.png", "foto3.png", "foto4.png"];
        let current = 0;

        function updateImage() {
            document.getElementById('carouselImage').src = images[current];
        }

        function nextSlide() {
            current = (current + 1) % images.length;
            updateImage();
        }

        function prevSlide() {
            current = (current - 1 + images.length) % images.length;
            updateImage();
        }

        // Rotação automática a cada 3.5 segundos
        setInterval(nextSlide, 3500);
    </script>

</body>
</html>
