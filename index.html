<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terranativa - Mudas Florestais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d2818;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Plano de Fundo / Overlay da Logo */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('logo.png'); /* Substitua pelo nome/caminho correto do arquivo da logo */
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            opacity: 0.08;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header img.logo-header {
            max-width: 220px;
            height: auto;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #2ec4b6;
            letter-spacing: 1px;
        }

        /* Estilo do Carrossel de Imagens */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 380px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            border: 2px solid #2ec4b6;
        }

        .carousel-slide {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Botões do Carrossel */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 24px;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 50%;
            z-index: 10;
            transition: background 0.3s;
        }

        .carousel-btn:hover {
            background: #2ec4b6;
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        /* Links de Contato e Redes Sociais */
        .links-section {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #ffffff;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85rem;
            color: #a0a0a0;
            position: relative;
            z-index: 2;
        }

        @media (max-width: 600px) {
            .carousel-container {
                height: 280px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <header>
            <img src="logo.png" alt="Terranativa Logo" class="logo-header">
            <h1>Terranativa Mudas Florestais</h1>
        </header>

        <div class="carousel-container">
            <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094;</button>
            <div class="carousel-slide" id="carouselSlide">
                <img src="foto1.png" alt="Mudas no solo">
                <img src="foto2.png" alt="Mudas na caminhonete">
                <img src="foto3.png" alt="Colheita de sementes">
                <img src="foto4.png" alt="Flor amarela">
            </div>
            <button class="carousel-btn next" onclick="moveSlide(1)">&#10095;</button>
        </div>

        <div class="links-section">
            <a href="https://wa.me/5562991744925" target="_blank" class="btn-link btn-whatsapp">
                Fale no WhatsApp
            </a>
            <a href="https://www.instagram.com/terranativamudas?igsi=c2xva2U0djh2MTh4" target="_blank" class="btn-link btn-instagram">
                Siga no Instagram
            </a>
        </div>
    </div>

    <footer>
        &copy; Terranativa Mudas Florestais. Todos os direitos reservados.
    </footer>

    <script>
        let currentIndex = 0;
        const slide = document.getElementById('carouselSlide');
        const totalSlides = slide.children.length;

        function updateSlide() {
            slide.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex >= totalSlides) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            }
            updateSlide();
        }

        // Transição automática a cada 4 segundos
        setInterval(() => {
            moveSlide(1);
        }, 4000);
    </script>
</body>
</html>
